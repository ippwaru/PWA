<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>IPP Waru App</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f287d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IPP Waru" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1f287d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f5f8ff;
    }
    /* Banner tombol instal (muncul hanya jika belum terinstal) */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #1f287d;
      padding: 12px 20px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999;
      font-weight: bold;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      cursor: pointer;
      border: 2px solid #e7b10a;
    }
    #install-banner button {
      background: #e7b10a;
      color: #1f287d;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- FRAME BLOG UTAMA -->
  <!-- GANTI tautan di bawah ini dengan URL blog Anda yang sebenarnya -->
  <iframe id="app-frame" src="https://korwilcambidikbudwaru.blogspot.com" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

  <!-- POPUP MANUAL INSTAL -->
  <div id="install-banner">
    <span>Pasang aplikasi IPP Waru di layar utama?</span>
    <button id="btn-install">Instal</button>
  </div>

  <script>
    // 1. Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('SW terdaftar:', reg.scope))
          .catch((err) => console.error('SW gagal:', err));
      });
    }

    // 2. Logika Prompt Instal Otomatis / Tombol
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Tampilkan banner instalasi jika dibuka di browser biasa
      if (!window.matchMedia('(display-mode: standalone)').matches) {
        installBanner.style.display = 'flex';
      }
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      console.log('PWA berhasil diinstal!');
    });
  </script>
</body>
</html>
